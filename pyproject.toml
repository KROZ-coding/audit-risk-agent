[project]
name = "audit-risk-agent"
version = "3.0.0"
description = "上市公司年报审计风险识别 - 本地运行版"
requires-python = ">=3.10"
dependencies = [
    # ── AI / LLM 框架 ──
    "langchain>=1.0,<2",
    "langchain-core>=1.0,<2",
    "langchain-openai>=1.0,<2",
    "langgraph>=1.0,<2",
    "langgraph-checkpoint>=3.0,<5",
    "langgraph-prebuilt>=1.0,<2",
    "langgraph-sdk>=0.2,<1",
    "langsmith>=0.4,<1",
    # ── Web 服务 ──
    "fastapi>=0.115,<1",
    "uvicorn>=0.30,<1",
    "pydantic>=2.7,<3",
    "Jinja2>=3.1,<4",
    "aiofiles>=23.0,<25",
    # ── 数据处理 ──
    "pandas>=2.2,<3",
    "numpy>=1.26,<3",
    "matplotlib>=3.9,<4",
    "Pillow>=10.0,<12",
    # ── 数据库 ──
    "SQLAlchemy>=2.0,<3",
    "python-dotenv>=1.0,<2",
    # ── 文档解析 ──
    "pypdf>=4.0,<7",
    "pdfplumber>=0.11,<1",
    "pymupdf>=1.24,<2",
    "openpyxl>=3.1,<4",
    "python-pptx>=1.0,<2",
    "docx2python>=3.0,<4",
    # ── 报告生成 ──
    "reportlab>=4.0,<5",
    # ── 向量数据库 ──
    "chromadb>=0.4,<1",
    "chroma-hnswlib>=0.7.5,<0.7.6",   # Windows 需要预编译 wheel，跳过 MSVC 编译
    # ── 存储 & 网络 ──
    "boto3>=1.35,<2",
    "requests>=2.31,<3",
    # ── 工具 ──
    "chardet>=5.0,<6",
    "rich>=13.0,<15",
    "python-multipart>=0.0.32",
]

[tool.uv]
# 使用阿里云镜像作为默认源，替代 pypi.org
[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true

# pypi 仅供 [tool.uv.sources] 显式引用：阿里云镜像同步 PyPI 新版有延迟（小时级），
# 当某个内部包的预发布版（如 a/b/c 后缀）刚 push 到官方 PyPI 还未同步到镜像时，
# 临时让该包从 PyPI 取，避免 lock/install 失败。explicit=true 保证不影响其他包的解析。
[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple/"
explicit = true

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio>=0.23,<1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
